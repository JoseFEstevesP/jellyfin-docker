services:
  jellyfin:
    image: "${JELLYFIN_IMAGE:-jellyfin/jellyfin:10.11.11}"
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${RENDER_GID:-105}"
    devices:
      - "${RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128"
    ports:
      - name: http
        target: 8096
        published: "${JELLYFIN_HTTP_PORT:-8096}"
        host_ip: "${JELLYFIN_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
      - name: discovery
        target: 7359
        published: "${JELLYFIN_DISCOVERY_PORT:-7359}"
        host_ip: "${JELLYFIN_DISCOVERY_BIND_ADDRESS:-127.0.0.1}"
        protocol: udp
    volumes:
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: "${MEDIA_PATH:-/media}"
        target: /media/series
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${MOVIES_PATH:-/media/peliculas}"
        target: /media/peliculas
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./fonts
        target: /usr/local/share/fonts/custom
        read_only: true
        bind:
          create_host_path: false
    environment:
      TZ: "${TZ:-Etc/UTC}"
      JELLYFIN_PublishedServerUrl: "${JELLYFIN_PUBLISHED_SERVER_URL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    entrypoint:
      - /bin/sh
      - /caddy-entrypoint.sh
    profiles:
      - https
    depends_on:
      jellyfin:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./scripts/caddy-entrypoint.sh
        target: /caddy-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME:-}"
      JELLYFIN_PUBLISHED_SERVER_URL: "${JELLYFIN_PUBLISHED_SERVER_URL:-}"
      JELLYFIN_HTTP_BIND_ADDRESS: "${JELLYFIN_HTTP_BIND_ADDRESS:-127.0.0.1}"
    restart: "on-failure:3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      LOG_LEVEL: info
      CAPTCHA_SOLVER: none
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: "${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:2.6.5}"
    profiles:
      - media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - name: http
        target: 9696
        published: "${PROWLARR_HTTP_PORT:-9696}"
        host_ip: "${PROWLARR_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/prowlarr
        target: /config
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: "${PROWLARR_MEM_LIMIT:-256m}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  sonarr:
    image: "${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:4.0.20}"
    profiles:
      - media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - name: http
        target: 8989
        published: "${SONARR_HTTP_PORT:-8989}"
        host_ip: "${SONARR_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/sonarr
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${MEDIA_ROOT_PATH:-/media}"
        target: /media
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: "${SONARR_MEM_LIMIT:-384m}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: "${RADARR_IMAGE:-lscr.io/linuxserver/radarr:6.4.4}"
    profiles:
      - media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - name: http
        target: 7878
        published: "${RADARR_HTTP_PORT:-7878}"
        host_ip: "${RADARR_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/radarr
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${MEDIA_ROOT_PATH:-/media}"
        target: /media
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: "${RADARR_MEM_LIMIT:-384m}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  qbittorrent:
    image: "${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent:5.2.4}"
    profiles:
      - media
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      WEBUI_PORT: "8080"
    ports:
      - name: http
        target: 8080
        published: "${QBITTORRENT_HTTP_PORT:-8080}"
        host_ip: "${QBITTORRENT_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/qbittorrent
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOADS_PATH:-/media/torrents}"
        target: /media/torrents
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: "${QBITTORRENT_MEM_LIMIT:-256m}"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  seerr:
    image: "${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:v3.5.0}"
    profiles:
      - media
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: "${TZ:-Etc/UTC}"
      PORT: "5055"
    ports:
      - name: http
        target: 5055
        published: "${SEERR_HTTP_PORT:-5055}"
        host_ip: "${SEERR_HTTP_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./config/seerr
        target: /app/config
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    mem_limit: "${SEERR_MEM_LIMIT:-512m}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
